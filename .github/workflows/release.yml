name: Release Creation

on:
  push:
    tags:
      - 'release-*'

env:
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  # The audio integration tier, run against the tagged source before anything is published.
  #
  # A release is the one moment where "the unit suite is green" is not enough: publishing pushes
  # the version to the Foundry Package API, which lists it publicly for every user's updater. That
  # is not a commit you can quietly amend. So the tier runs first, and `build` waits for it.
  #
  # `require_credentials: true` makes a missing licence secret a hard failure rather than a skip -
  # a gate that silently passes when it cannot run certifies nothing. To ship without it (the
  # Foundry download being unavailable, say), set the `SKIP_AUDIO_GATE` repository variable to
  # 'true'; that is deliberately a visible, auditable action rather than a quiet fallback.
  audio:
    if: vars.SKIP_AUDIO_GATE != 'true'
    uses: ./.github/workflows/integration.yml
    secrets: inherit
    with:
      require_credentials: true
      # Certify the artifact, not the tree. The zip ships a minified bundle; running the audio
      # specs against unbundled source would pass on code no user ever loads.
      against_dist: true

  build:
    needs: audio
    # `needs` alone would skip the release when the gate is skipped, which is right for a missing
    # gate but wrong for a deliberate override - hence `always()` plus an explicit check that the
    # gate either passed or was intentionally turned off.
    if: always() && (needs.audio.result == 'success' || vars.SKIP_AUDIO_GATE == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      # Read module ID from module.json
      - name: Get module ID
        id: module_id
        run: echo "id=$(jq -r '.id' module.json)" >> $GITHUB_OUTPUT

      # Extract version from tag (release-X.Y.Z -> X.Y.Z)
      - name: Set up variables
        id: get_vars
        run: |
          TAG=${GITHUB_REF/refs\/tags\//}
          VERSION=${TAG#release-}
          MODULE_ID=${{ steps.module_id.outputs.id }}
          echo "TAG_NAME=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "MODULE_ID=$MODULE_ID" >> $GITHUB_ENV
          echo "ZIP_NAME=module.zip" >> $GITHUB_ENV
          echo "RELEASE_DOWNLOAD_URL=${{ env.REPO_URL }}/releases/download/$TAG/module.zip" >> $GITHUB_ENV
          echo "RELEASE_MANIFEST_URL=${{ env.REPO_URL }}/releases/download/$TAG/module.json" >> $GITHUB_ENV
          echo "LATEST_MANIFEST_URL=${{ env.REPO_URL }}/releases/latest/download/module.json" >> $GITHUB_ENV

          echo "Tag: $TAG"
          echo "Version: $VERSION"
          echo "Module ID: $MODULE_ID"

      # Update module.json with version and download URLs
      - name: Update module.json
        uses: microsoft/variable-substitution@v1
        with:
          files: 'module.json'
        env:
          version: ${{ env.VERSION }}
          download: ${{ env.RELEASE_DOWNLOAD_URL }}
          manifest: ${{ env.LATEST_MANIFEST_URL }}
          flags.hotReload: false

      # Verify the version in module.json matches the tag
      - name: Verify version
        run: |
          MODULE_VERSION=$(jq -r '.version' module.json)
          if [[ ! "$MODULE_VERSION" == "${{ env.VERSION }}" ]]; then
            echo "Error: module.json version ($MODULE_VERSION) does not match tag version (${{ env.VERSION }})"
            exit 1
          fi
          echo "Version verified: $MODULE_VERSION"

      # Build dist/ - the minified tree that ships.
      #
      # Order matters: this runs AFTER the module.json substitution above, because the build copies
      # module.json into dist/ and the copy must carry the release's version and download URLs. Run
      # the other way round and the published manifest points at an empty `download`.
      - name: Build
        run: npm run build

      # Zip the built tree, not the source. `cd dist` keeps the archive rooted at the module - a zip
      # with a leading `dist/` component installs as a module Foundry cannot find.
      #
      # The sourcemap is excluded deliberately: it is four times the size of everything else and is
      # published as a separate release asset below, for anyone triaging a minified stack trace.
      - name: Zip Files
        run: |
          cd dist
          zip -r "../${{ env.ZIP_NAME }}" . -x "*.map"

      # The audio gate now tests dist/, and the build itself verifies the manifest against dist/ -
      # but neither covers the archiving step. A file present in dist/ and missing from the zip
      # (an exclude pattern that matched too much, say) still ships a module that 404s on load, and
      # every test upstream stays green. Verify the archive itself.
      - name: Verify the zip contains everything module.json declares
        run: |
          MISSING=0
          CONTENTS=$(unzip -Z1 "${{ env.ZIP_NAME }}")
          for path in $(jq -r '[.esmodules[]?, .scripts[]?, .styles[]?, (.languages[]?.path)] | .[]' module.json); do
            if ! grep -qxF "$path" <<< "$CONTENTS"; then
              echo "::error::module.json declares '$path', but it is not in ${{ env.ZIP_NAME }}"
              MISSING=1
            fi
          done
          if [[ "$MISSING" == "1" ]]; then
            echo "Archive contents were:"
            echo "$CONTENTS"
            exit 1
          fi
          echo "All manifest-declared paths are present in the archive."
          ls -l "${{ env.ZIP_NAME }}"

      # Fetch existing release body if it exists
      - name: Fetch Release Body
        id: release
        uses: cardinalby/git-get-release-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag: ${{ env.TAG_NAME }}
          doNotFailIfNotFound: true

      # Update release with the built files.
      #
      # The sourcemap rides along as a third asset. The shipped bundle carries no
      # `//# sourceMappingURL` comment - linking one would cost every user a 404 per load for a
      # file that is not in the zip - so this is opt-in triage equipment: download it next to the
      # release, load it in devtools, and a stack trace against minified line 1 resolves back to
      # the module and line it came from.
      - name: Update Release with Files
        id: create_version_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitNameDuringUpdate: true
          draft: false
          prerelease: false
          omitDraftDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './module.json, ./${{ env.ZIP_NAME }}, ./dist/scripts/game-orchestra.mjs.map'
          tag: ${{ env.TAG_NAME }}
          body: |
            ${{ steps.release.outputs.body }}

            **Installation:** To manually install this release, use the following manifest URL: ${{ env.RELEASE_MANIFEST_URL }}

      # Read module metadata for later steps
      - name: Read module metadata
        id: module
        run: |
          echo "title=$(jq -r '.title' module.json)" >> $GITHUB_OUTPUT
          echo "compat_min=$(jq -r '.compatibility.minimum' module.json)" >> $GITHUB_OUTPUT
          echo "compat_verified=$(jq -r '.compatibility.verified' module.json)" >> $GITHUB_OUTPUT
          echo "compat_max=$(jq -r '.compatibility.maximum' module.json)" >> $GITHUB_OUTPUT

      # Release to Foundry Package API
      - name: Release Foundry Package
        env:
          FOUNDRY_API_TOKEN: ${{ secrets.FOUNDRY_API_TOKEN }}
        if: env.FOUNDRY_API_TOKEN != ''
        run: |
          jq -n \
            --arg id "${{ env.MODULE_ID }}" \
            --arg version "${{ env.VERSION }}" \
            --arg manifest "${{ env.RELEASE_MANIFEST_URL }}" \
            --arg download "${{ env.RELEASE_DOWNLOAD_URL }}" \
            --arg notes "${{ env.REPO_URL }}/releases/tag/${{ env.TAG_NAME }}" \
            --arg compat_min "${{ steps.module.outputs.compat_min }}" \
            --arg compat_verified "${{ steps.module.outputs.compat_verified }}" \
            --arg compat_max "${{ steps.module.outputs.compat_max }}" \
            '{
              id: $id,
              release: {
                version: $version,
                manifest: $manifest,
                download: $download,
                notes: $notes,
                compatibility: (
                  {minimum: $compat_min, verified: $compat_verified}
                  + (if $compat_max == "" or $compat_max == "null" then {} else {maximum: $compat_max} end)
                )
              }
            }' > payload.json

          cat payload.json

          curl -X POST "https://foundryvtt.com/_api/packages/release_version/" \
            -H "Content-Type: application/json" \
            -H "Authorization: ${{ secrets.FOUNDRY_API_TOKEN }}" \
            -d @payload.json
